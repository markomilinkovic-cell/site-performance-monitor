<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Site performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#12161c; --ink-2:#414c5c; --ink-3:#77839a;
  --paper:#f7f8fa; --surface:#fff; --rule:#dfe3ea; --rule-strong:#c3cad6;
  --good:#2f8f5b; --mid:#b5781a; --bad:#bd3f3d;
  --good-zone:#dff0e5; --mid-zone:#f8ecd6; --bad-zone:#f7dedd;
  --accent:#4a5bc4; --u:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ink:#e7ebf2; --ink-2:#a6b0c2; --ink-3:#6f7b8f;
  --paper:#101319; --surface:#161b23; --rule:#272e3a; --rule-strong:#3a4453;
  --good:#5cc088; --mid:#d9a441; --bad:#e0706d;
  --good-zone:#1a2e23; --mid-zone:#2e2718; --bad-zone:#301d1e; --accent:#8b97e8;
}}
:root[data-theme="dark"]{
  --ink:#e7ebf2; --ink-2:#a6b0c2; --ink-3:#6f7b8f;
  --paper:#101319; --surface:#161b23; --rule:#272e3a; --rule-strong:#3a4453;
  --good:#5cc088; --mid:#d9a441; --bad:#e0706d;
  --good-zone:#1a2e23; --mid-zone:#2e2718; --bad-zone:#301d1e; --accent:#8b97e8;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.masthead{border-bottom:1px solid var(--rule-strong);background:var(--surface)}
.masthead .wrap{padding-top:28px;padding-bottom:24px}
.site-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px 16px}
h1{margin:0;font-size:clamp(26px,5vw,38px);font-weight:700;letter-spacing:-.022em;line-height:1.05}
.run-meta{color:var(--ink-3);font-size:13.5px;font-weight:500}
.run-meta span+span{margin-left:14px;padding-left:14px;border-left:1px solid var(--rule)}
.seg{display:inline-flex;border:1px solid var(--rule-strong);border-radius:4px;overflow:hidden}
.seg button{font:inherit;font-size:13px;font-weight:600;padding:5px 14px;border:0;cursor:pointer;
  background:var(--paper);color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--rule-strong)}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:var(--paper);
  border:1px solid var(--rule-strong);border-radius:4px;padding:4px 8px}
.spread{margin-top:28px}
.spread-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;
  font-size:13.5px;color:var(--ink-2);font-weight:500}
.spread-rail{position:relative;height:48px;border:1px solid var(--rule);border-radius:3px;overflow:hidden;background:var(--surface)}
.zone{position:absolute;top:0;bottom:0}
.pin{position:absolute;top:0;bottom:0;width:3px;transform:translateX(-1.5px);border-radius:2px}
.pin::after{content:attr(data-label);position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);
  font-size:11px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.spread-scale{display:flex;justify-content:space-between;margin-top:28px;font-size:11.5px;color:var(--ink-3);font-weight:500}
main .wrap{padding-top:32px;padding-bottom:48px}
.drift{border:1px solid var(--mid);background:var(--mid-zone);border-radius:4px;padding:12px 16px;margin-bottom:24px;font-size:13.5px}
.drift b{display:block;margin-bottom:4px}
.field{border:1px solid var(--rule);border-radius:4px;background:var(--surface);padding:16px 18px;margin-bottom:24px}
.field h2{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.field .sub{font-size:12.5px;color:var(--ink-3);margin:0 0 14px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.fcell{border:1px solid var(--rule);border-radius:4px;padding:10px 12px}
.fcell .lab{font-size:12px;color:var(--ink-3);font-weight:600}
.fcell .val{font-size:22px;font-weight:700;line-height:1.2;margin:2px 0 6px}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--paper)}
.bar i{display:block}
.barlab{font-size:11px;color:var(--ink-3);margin-top:4px}
.history{border:1px solid var(--rule);border-radius:4px;background:var(--surface);padding:16px 18px;margin-bottom:8px}
.history h2{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--ink-3);letter-spacing:.02em}
.hrow{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.hcell{flex:0 0 auto;text-align:center;min-width:64px;padding:8px 10px;border:1px solid var(--rule);border-radius:4px}
.hcell b{display:block;font-size:19px;font-weight:700;line-height:1.1}
.hcell span{font-size:11px;color:var(--ink-3);font-weight:500}
.hcell.engine-change{border-left:3px solid var(--ink-3)}
.group{border-top:1px solid var(--rule-strong);padding-top:20px;margin-top:32px}
.group-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.group-name{margin:0;font-size:20px;font-weight:600;letter-spacing:-.012em}
.group-pattern{font-size:13px;color:var(--accent);font-weight:600}
.flag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:3px;
  border:1px solid var(--mid);background:var(--mid-zone);color:var(--ink);margin-left:8px;vertical-align:middle}
.coverage{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:4px}
.coverage b{color:var(--ink-2);font-weight:600}
.page{margin-top:24px;background:var(--surface);border:1px solid var(--rule);border-radius:4px;overflow:hidden}
.page-head{display:flex;gap:16px;align-items:center;padding:16px;border-bottom:1px solid var(--rule)}
.score{flex:0 0 auto;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
  font-size:19px;font-weight:700;line-height:1;border:2px solid currentColor}
.delta{font-size:12px;font-weight:600;margin-left:4px}
.spread-note{font-size:12px;color:var(--ink-3);font-weight:500;margin-left:6px}
.page-id{min-width:0;flex:1}
.page-title{font-weight:600;font-size:15px;margin:0 0 2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page-url{font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;text-decoration:none}
.page-url:hover{color:var(--accent);text-decoration:underline}
.rails{padding:16px 16px 12px}
.rail{display:grid;grid-template-columns:118px 1fr 78px;gap:12px;align-items:center;padding:6px 0}
.rail-name{font-size:13px;color:var(--ink-2);font-weight:500}
.rail-track{position:relative;height:16px;border-radius:2px;overflow:hidden;background:var(--paper)}
.rail-marker{position:absolute;top:-3px;bottom:-3px;width:3px;transform:translateX(-1.5px);background:var(--ink);border-radius:2px}
.rail-val{text-align:right;font-size:13.5px;font-weight:600}
.opps{border-top:1px solid var(--rule);padding:14px 16px 16px}
.opps-title{font-size:12.5px;color:var(--ink-3);font-weight:600;margin:0 0 8px}
.opp{display:flex;justify-content:space-between;gap:16px;padding:5px 0;font-size:13.5px;border-bottom:1px dotted var(--rule)}
.opp:last-child{border-bottom:0}
.opp-save{color:var(--bad);font-weight:600;white-space:nowrap}
.notice{padding:48px 0;max-width:56ch}
.notice h2{margin:0 0 8px;font-size:20px;font-weight:600}
.notice p{margin:0;color:var(--ink-2)}
@media (max-width:640px){
  .rail{grid-template-columns:96px 1fr 62px;gap:8px}
  .rail-name{font-size:12px}.rail-val{font-size:12.5px}
  .score{width:46px;height:46px;font-size:17px}
  .run-meta span+span{margin-left:8px;padding-left:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="masthead">
  <div class="wrap">
    <div class="site-line">
      <h1 id="siteName">Site performance</h1>
      <div class="run-meta" id="runMeta"></div>
      <span class="seg" id="seg" hidden>
        <button type="button" data-s="mobile" aria-pressed="true">Mobile</button>
        <button type="button" data-s="desktop" aria-pressed="false">Desktop</button>
      </span>
      <select id="runPick" hidden></select>
    </div>
    <div class="spread" id="spread" hidden>
      <div class="spread-head"><span>Score by page group</span><span id="spreadCount"></span></div>
      <div class="spread-rail">
        <div class="zone" style="left:0;width:50%;background:var(--bad-zone)"></div>
        <div class="zone" style="left:50%;width:40%;background:var(--mid-zone)"></div>
        <div class="zone" style="left:90%;width:10%;background:var(--good-zone)"></div>
        <div id="pins"></div>
      </div>
      <div class="spread-scale"><span>0</span><span>50</span><span>90</span><span>100</span></div>
    </div>
  </div>
</header>
<main><div class="wrap" id="report">
  <div class="notice"><h2>Loading…</h2><p>Reading stored measurements.</p></div>
</div></main>

<script>
(function(){
  "use strict";
  var METRICS=[
    {key:"lcp",name:"LCP",unit:"s",scale:6,good:2.5,mid:4},
    {key:"fcp",name:"FCP",unit:"s",scale:5,good:1.8,mid:3},
    {key:"tbt",name:"TBT",unit:"ms",scale:1200,good:200,mid:600},
    {key:"cls",name:"CLS",unit:"",scale:.5,good:.1,mid:.25},
    {key:"si",name:"Speed Index",unit:"s",scale:8,good:3.4,mid:5.8},
    {key:"tti",name:"TTI",unit:"s",scale:12,good:3.8,mid:7.3}
  ];
  var $=function(id){return document.getElementById(id)};
  var runs=[], strat="mobile", curIdx=0;

  // A page carries {mobile:{...}, desktop:{...}}; older runs stored the
  // numbers flat on the page itself, so fall back to that.
  function view(p){
    if(p&&p[strat])return p[strat];
    if(p&&p.mobile)return p.mobile;
    if(p&&typeof p.score==="number")return p;
    return null;
  }
  function hasStrat(run,s){
    return (run.groups||[]).some(function(g){return (g.pages||[]).some(function(p){return p&&p[s]})});
  }

  function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
  function scoreColor(s){return s>=90?"var(--good)":s>=50?"var(--mid)":"var(--bad)"}
  function bandColor(v,g,m){return v<=g?"var(--good)":v<=m?"var(--mid)":"var(--bad)"}
  function fmt(v,u){return u==="ms"?Math.round(v)+" ms":u==="s"?(Math.round(v*10)/10).toFixed(1)+" s":String(Math.round(v*1e4)/1e4)}
  function pos(v,scale){return Math.max(1.5,Math.min(98.5,v/scale*100))}
  function groupScore(g){
    var vals=(g.pages||[]).map(view).filter(function(v){return v&&typeof v.score==="number"});
    return vals.length?Math.round(vals.reduce(function(a,v){return a+v.score},0)/vals.length):null;
  }
  function runScore(r){
    var vals=(r.groups||[]).map(groupScore).filter(function(v){return v!==null});
    return vals.length?Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length):null;
  }

  // Runs before the switch to PageSpeed Insights carry no engine field; they
  // were local Lighthouse runs. Scores from different engines run on different
  // hardware and are not comparable, so no deltas are drawn across the switch.
  function engineOf(r){return (r&&r.engine)||"lighthouse"}
  function engineLabel(e){return e==="psi"?"PageSpeed Insights":e==="lighthouse"?"local Lighthouse":e}

  function spreadHTML(d){
    if(!d||!d.spread||d.spread.min===d.spread.max)return"";
    return '<span class="spread-note">median of '+(d.runs||"?")+', range '+d.spread.min+'\u2013'+d.spread.max+'</span>';
  }

  function railHTML(m,v){
    var gw=m.good/m.scale*100, mw=(m.mid-m.good)/m.scale*100, bw=Math.max(0,100-gw-mw);
    return '<div class="rail"><div class="rail-name">'+esc(m.name)+'</div>'+
      '<div class="rail-track">'+
      '<div class="zone" style="left:0;width:'+gw+'%;background:var(--good-zone)"></div>'+
      '<div class="zone" style="left:'+gw+'%;width:'+mw+'%;background:var(--mid-zone)"></div>'+
      '<div class="zone" style="left:'+(gw+mw)+'%;width:'+bw+'%;background:var(--bad-zone)"></div>'+
      '<div class="rail-marker" style="left:'+pos(v,m.scale)+'%"></div></div>'+
      '<div class="rail-val" style="color:'+bandColor(v,m.good,m.mid)+'">'+fmt(v,m.unit)+'</div></div>';
  }

  // Lighthouse noise is a few points, so a small delta means nothing. Only
  // colour a change that is bigger than the measured spread (or 5 points when
  // no spread was recorded); otherwise call it noise.
  function deltaHTML(cur,prev,spread){
    if(typeof prev!=="number"||typeof cur!=="number")return"";
    var d=cur-prev;
    if(d===0)return'<span class="delta" style="color:var(--ink-3)">no change</span>';
    var band=spread&&typeof spread.min==="number"?Math.max(3,spread.max-spread.min):5;
    if(Math.abs(d)<=band)
      return '<span class="delta" style="color:var(--ink-3)">'+(d>0?"+":"")+d+' (within noise)</span>';
    return '<span class="delta" style="color:'+(d>0?"var(--good)":"var(--bad)")+'">'+(d>0?"+":"")+d+'</span>';
  }

  function pageHTML(p,prevScore){
    var d=view(p);
    if(!d)return"";
    var h='<article class="page"><div class="page-head">'+
      '<div class="score" style="color:'+scoreColor(d.score)+'">'+esc(d.score)+'</div>'+
      '<div class="page-id"><p class="page-title">'+esc(p.title||p.url)+
        deltaHTML(d.score,prevScore,d.spread)+spreadHTML(d)+'</p>'+
      '<a class="page-url" href="'+esc(p.url)+'" target="_blank" rel="noopener noreferrer">'+esc(p.url)+'</a>'+
      '</div></div>';
    if(d.metrics){
      h+='<div class="rails">';
      METRICS.forEach(function(m){var v=d.metrics[m.key];if(typeof v==="number")h+=railHTML(m,v)});
      h+='</div>';
    }
    if(d.opportunities&&d.opportunities.length){
      h+='<div class="opps"><p class="opps-title">Top opportunities</p>';
      d.opportunities.slice(0,5).forEach(function(o){
        h+='<div class="opp"><span>'+esc(o.title)+'</span><span class="opp-save">−'+
           (Math.round((o.savingsMs||0)/10)/100).toFixed(2)+' s</span></div>';
      });
      h+='</div>';
    }
    return h+'</article>';
  }

  var FIELD=[
    {key:"lcp",name:"LCP",good:2.5,mid:4},
    {key:"inp",name:"INP",good:200,mid:500},
    {key:"cls",name:"CLS",good:.1,mid:.25},
    {key:"fcp",name:"FCP",good:1.8,mid:3},
    {key:"ttfb",name:"TTFB",good:.8,mid:1.8}
  ];

  function fieldHTML(run){
    var c=run.crux;
    if(!c||!c.field)return"";
    var f=c.field[strat];
    if(!f)return"";
    if(f.unavailable){
      return '<div class="field"><h2>Field data (CrUX)</h2>'+
        '<p class="sub">Unavailable: '+esc(f.unavailable)+'</p></div>';
    }
    var period="";
    if(f.collectionPeriod&&f.collectionPeriod.lastDate){
      var d=f.collectionPeriod.lastDate;
      period=" · through "+[d.year,String(d.month).padStart(2,"0"),String(d.day).padStart(2,"0")].join("-");
    }
    var h='<div class="field"><h2>Field data (CrUX)</h2>'+
      '<p class="sub">Real visits from Chrome users, 28-day rolling average'+esc(period)+
      ' — unlike the Lighthouse score above, which is a lab measurement.</p><div class="fgrid">';
    FIELD.forEach(function(m){
      var v=f.metrics&&f.metrics[m.key];
      if(!v)return;
      var col=v.p75<=m.good?"var(--good)":v.p75<=m.mid?"var(--mid)":"var(--bad)";
      var unit=m.key==="inp"?" ms":m.key==="cls"?"":" s";
      h+='<div class="fcell"><div class="lab">'+esc(m.name)+' (p75)</div>'+
         '<div class="val" style="color:'+col+'">'+esc(v.p75)+unit+'</div>';
      if(v.distribution&&v.distribution.length===3){
        h+='<div class="bar">'+
           '<i style="width:'+v.distribution[0]+'%;background:var(--good)"></i>'+
           '<i style="width:'+v.distribution[1]+'%;background:var(--mid)"></i>'+
           '<i style="width:'+v.distribution[2]+'%;background:var(--bad)"></i></div>'+
           '<div class="barlab">'+v.distribution[0]+'% good · '+v.distribution[2]+'% poor</div>';
      }
      h+='</div>';
    });
    return h+'</div></div>';
  }

  function driftHTML(run){
    var d=run.drift;
    if(!d)return"";
    var parts=[];
    var retried=d.retriedFromPreviousRun||[];
    if(d.newPatterns&&d.newPatterns.length)
      parts.push("new sections, measured with an automatically chosen page nobody has reviewed yet: "+d.newPatterns.join(", "));
    var gone=(d.missingPatterns||[]).filter(function(p){return retried.indexOf(p)===-1});
    if(retried.length)
      parts.push("missing from the sitemap, measured on last run's page: "+retried.join(", "));
    if(gone.length)
      parts.push("missing and not measured: "+gone.join(", "));
    if(!parts.length)return"";
    return '<div class="drift"><b>Site structure changed since the grouping was set up</b>'+
      esc(parts.join(" · "))+'. Every other section was measured on the same pages as before and compares normally.</div>';
  }

  function historyHTML(){
    if(runs.length<2)return"";
    var h='<div class="history"><h2>Measurement history</h2><div class="hrow">';
    var shown=runs.slice(0,12).slice().reverse();
    shown.forEach(function(r,i){
      var s=runScore(r);
      var changed=i>0&&engineOf(r)!==engineOf(shown[i-1]);
      h+='<div class="hcell'+(changed?' engine-change':'')+'"'+
         (changed?' title="Measured with '+esc(engineLabel(engineOf(r)))+' from here on — not comparable with earlier runs"':'')+
         '><b style="color:'+(s===null?"var(--ink-3)":scoreColor(s))+'">'+
         (s===null?"–":s)+'</b><span>'+esc((r.generated||"").slice(5))+'</span></div>';
    });
    return h+'</div></div>';
  }

  function render(idx){
    curIdx=idx;
    var run=runs[idx];
    if(!run){
      $("report").innerHTML='<div class="notice"><h2>No measurements yet</h2>'+
        '<p>Run the performance skill to populate this report.</p></div>';
      return;
    }
    var prev=runs[idx+1];
    var engineChanged=!!prev&&engineOf(prev)!==engineOf(run);
    var prevByName={};
    if(prev&&!engineChanged)(prev.groups||[]).forEach(function(g){
      var v=view((g.pages||[])[0]);
      if(v&&typeof v.score==="number")prevByName[g.name]=v.score;
    });

    $("siteName").textContent=run.site||"Performanse sajta";
    var meta=[];
    if(run.generated)meta.push(run.generated);
    meta.push(engineLabel(engineOf(run))+(run.lighthouseVersion?" · Lighthouse "+run.lighthouseVersion:""));
    if(run.skipped&&run.skipped.length)
      meta.push(run.skipped.length+" group(s) skipped: "+run.skipped.map(function(x){return x.name}).join(", "));
    $("runMeta").innerHTML=meta.map(function(m){return"<span>"+esc(m)+"</span>"}).join("");

    var groups=run.groups||[],total=0,measured=0,pins="";
    groups.forEach(function(g){
      total+=typeof g.totalPages==="number"?g.totalPages:(g.pages||[]).length;
      measured+=(g.pages||[]).length;
      var gs=groupScore(g);
      if(gs!==null)pins+='<div class="pin" data-label="'+esc(g.name)+'" style="left:'+gs+'%;background:'+scoreColor(gs)+'"></div>';
    });
    $("pins").innerHTML=pins;
    $("spreadCount").textContent=groups.length+" groups · "+total+" pages · "+measured+" measured";
    $("spread").hidden=groups.length===0;

    var engineNote=engineChanged
      ?'<div class="drift"><b>Measuring method changed</b>This run was measured with '+esc(engineLabel(engineOf(run)))+
        ', the previous one with '+esc(engineLabel(engineOf(prev)))+
        '. They run on different hardware, so score changes against earlier runs are not shown — compare forward from here.</div>'
      :'';
    var out=engineNote+driftHTML(run)+fieldHTML(run)+historyHTML();
    groups.forEach(function(g){
      var t=typeof g.totalPages==="number"?g.totalPages:(g.pages||[]).length,n=(g.pages||[]).length;
      var flag=g.provisional?'<span class="flag">new section · unreviewed sample</span>'
        :g.notInSitemap?'<span class="flag">not in sitemap anymore</span>':'';
      out+='<section class="group"><div class="group-head"><h2 class="group-name">'+esc(g.name)+flag+'</h2>'+
        (g.pattern?'<span class="group-pattern">'+esc(g.pattern)+'</span>':'')+'</div>'+
        '<p class="coverage">'+(t>n
          ?'<b>'+t+'</b> pages in this group, <b>'+n+'</b> measured — same template, so the sample stands for the group'
          :'<b>'+t+'</b> '+(t===1?'page':'pages')+', all measured')+'</p>';
      (g.pages||[]).forEach(function(p){out+=pageHTML(p,prevByName[g.name])});
      out+='</section>';
    });
    $("report").innerHTML=out;
  }

  function fillPicker(){
    if(runs.length<2)return;
    var sel=$("runPick");
    sel.innerHTML=runs.map(function(r,i){
      return '<option value="'+i+'">'+esc(r.generated||("run "+(i+1)))+(i===0?" (latest)":"")+'</option>';
    }).join("");
    sel.hidden=false;
    sel.addEventListener("change",function(){render(parseInt(sel.value,10))});
  }

  function setupToggle(){
    var run=runs[0];
    if(!run)return;
    var avail=["mobile","desktop"].filter(function(s){return hasStrat(run,s)});
    if(avail.length<2)return;
    var seg=$("seg");
    seg.hidden=false;
    seg.addEventListener("click",function(e){
      var b=e.target.closest("button");
      if(!b)return;
      strat=b.dataset.s;
      [].forEach.call(seg.querySelectorAll("button"),function(x){
        x.setAttribute("aria-pressed",String(x.dataset.s===strat));
      });
      render(curIdx);
    });
  }

  (async function(){
    var db=null;
    try{db=await claude.use("db")}catch(e){}
    if(!db){
      $("report").innerHTML='<div class="notice"><h2>Data unavailable</h2>'+
        '<p>This report reads stored measurements and has no database access here. Open it while signed in to the owning organization.</p></div>';
      return;
    }
    try{
      var snap=await db.collection("runs").orderBy("generatedAt","desc").limit(50).get();
      runs=snap.docs.map(function(d){return d.data()}).filter(function(r){return r&&r.groups});
    }catch(e){
      $("report").innerHTML='<div class="notice"><h2>Read error</h2><p>'+esc(e&&e.message||e)+'</p></div>';
      return;
    }
    setupToggle();
    fillPicker();
    render(0);
  })();
})();
</script>
</body>
</html>
